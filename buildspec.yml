# AWS CodeBuild — build the production blackout-web image and push it to ECR.
#
# WHY THIS EXISTS: `.github/workflows/ecr-push-production.yml` is itself a GitHub Action, so a
# GitHub Actions outage (major_outage 2026-08-06 15:22 UTC) freezes every production deploy with
# no way to ship a fix. This buildspec moves the build+push off GitHub entirely — CodeBuild pulls
# the source from S3 and reads build secrets from Secrets Manager, so the only dependency left is
# AWS itself. GitHub Actions is retained as the PR test gate only.
#
# SCOPE — BUILD AND PUSH ONLY. This buildspec deliberately does NOT roll ECS, purge Cloudflare, or
# validate static assets. Those are phase 2 and are authorized separately; a live members' trading
# desk runs on this cluster during RTH and an unattended rollout is not an acceptable side effect
# of "the image built". The produced image sits in ECR until someone deploys it.
#
# The project is configured with privileged-mode (docker) and a LOCAL docker-layer cache; those are
# project-level settings, not buildspec settings — see the CLI/Terraform that creates the project.

version: 0.2

env:
  # CodeBuild's DEFAULT shell on Linux is /bin/sh (dash), NOT bash. Every command block here starts
  # with `set -euo pipefail`, and dash does not support `-o pipefail` — it aborts the whole phase
  # with exit status 2 before running a single line, producing a failure with no output at all.
  # Do not remove this.
  shell: bash

  variables:
    AWS_DEFAULT_REGION: us-east-1
    ECR_REGISTRY: 177922194517.dkr.ecr.us-east-1.amazonaws.com
    ECR_REPOSITORY: blackout-web
    # BuildKit gives us parallel multi-stage execution and much better layer reuse against the
    # LOCAL_DOCKER_LAYER_CACHE than the legacy builder.
    DOCKER_BUILDKIT: "1"

  # NEXT_PUBLIC_* values are inlined into the CLIENT bundles by `next build`, so they must be
  # present AT BUILD TIME — a missing one does not error, it silently ships a broken client
  # (dead Clerk sign-in, dead Whop checkout buttons). They are mapped straight from the live
  # production secret by ARN + JSON key; nothing is ever inlined into this file, and CodeBuild
  # echoes buildspec commands UNEXPANDED, so no value reaches the log. Never add `set -x`.
  secrets-manager:
    NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "arn:aws:secretsmanager:us-east-1:177922194517:secret:blackout-production/app/env-sjdvhV:NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
    NEXT_PUBLIC_WHOP_CHECKOUT_MONTHLY: "arn:aws:secretsmanager:us-east-1:177922194517:secret:blackout-production/app/env-sjdvhV:NEXT_PUBLIC_WHOP_CHECKOUT_MONTHLY"
    NEXT_PUBLIC_WHOP_CHECKOUT_YEARLY: "arn:aws:secretsmanager:us-east-1:177922194517:secret:blackout-production/app/env-sjdvhV:NEXT_PUBLIC_WHOP_CHECKOUT_YEARLY"
    NEXT_PUBLIC_WHOP_CHECKOUT_COMMUNITY: "arn:aws:secretsmanager:us-east-1:177922194517:secret:blackout-production/app/env-sjdvhV:NEXT_PUBLIC_WHOP_CHECKOUT_COMMUNITY"
    NEXT_PUBLIC_WHOP_STORE_URL: "arn:aws:secretsmanager:us-east-1:177922194517:secret:blackout-production/app/env-sjdvhV:NEXT_PUBLIC_WHOP_STORE_URL"

phases:
  pre_build:
    commands:
      - |
        set -euo pipefail

        # ---- Resolve the git commit this build represents -------------------------------------
        # The image tag MUST be the git SHA: the ECS roll pins `:<sha>` (never `:latest`, which
        # resolves stale after a failed deploy), and the app stamps GITHUB_SHA into
        # CF_PURGE_DEPLOY_ID for cache-busting. With an S3 source there is no git metadata in the
        # build container, and CODEBUILD_RESOLVED_SOURCE_VERSION is the S3 version id, NOT a SHA —
        # so the packaging script writes the SHA into .codebuild-source-commit inside the zip.
        # Precedence, most-explicit first, so this same buildspec keeps working unchanged if the
        # source type is later switched to GitHub (where RESOLVED_SOURCE_VERSION *is* the SHA):
        #   1. SOURCE_COMMIT env override (operator forces a tag at start-build time)
        #   2. .codebuild-source-commit from the S3 zip
        #   3. CODEBUILD_RESOLVED_SOURCE_VERSION, but only if it looks like a git SHA
        if [ -n "${SOURCE_COMMIT:-}" ]; then
          IMAGE_TAG="${SOURCE_COMMIT}"
          TAG_SOURCE="SOURCE_COMMIT env override"
        elif [ -f .codebuild-source-commit ]; then
          IMAGE_TAG="$(tr -d '[:space:]' < .codebuild-source-commit)"
          TAG_SOURCE=".codebuild-source-commit (S3 zip)"
        elif printf '%s' "${CODEBUILD_RESOLVED_SOURCE_VERSION:-}" | grep -Eq '^[0-9a-f]{40}$'; then
          IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION}"
          TAG_SOURCE="CODEBUILD_RESOLVED_SOURCE_VERSION"
        else
          echo "FATAL: cannot resolve a git commit SHA to tag this image with."
          echo "       Pass -e SOURCE_COMMIT=<sha>, or package the source with scripts/codebuild/package-source.sh."
          exit 1
        fi

        # Refuse to push a garbage tag. An S3 version id or a truncated SHA here would produce an
        # image nobody can trace back to a commit, and the ECS roll would pin something unresolvable.
        if ! printf '%s' "${IMAGE_TAG}" | grep -Eq '^[0-9a-f]{40}$'; then
          echo "FATAL: resolved image tag is not a 40-char git SHA: '${IMAGE_TAG}' (from ${TAG_SOURCE})"
          exit 1
        fi
        echo "Image tag: ${IMAGE_TAG} (resolved from ${TAG_SOURCE})"

        # ---- Fail CLOSED on an empty build-time public var ------------------------------------
        # The GitHub Actions path passed these through `${{ secrets.* }}`, which expands to an
        # empty string when the secret is missing — the build still succeeded and shipped a client
        # with a dead Clerk key. Here an empty value is a hard failure instead of a silent one.
        # Values are NEVER printed; only presence is reported.
        MISSING=""
        for V in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY \
                 NEXT_PUBLIC_WHOP_CHECKOUT_MONTHLY \
                 NEXT_PUBLIC_WHOP_CHECKOUT_YEARLY \
                 NEXT_PUBLIC_WHOP_CHECKOUT_COMMUNITY \
                 NEXT_PUBLIC_WHOP_STORE_URL; do
          if [ -z "$(eval "printf '%s' \"\${${V}:-}\"")" ]; then
            MISSING="${MISSING} ${V}"
            echo "  ${V}: MISSING/EMPTY"
          else
            echo "  ${V}: present"
          fi
        done
        if [ -n "${MISSING}" ]; then
          echo "FATAL: build-time public vars resolved empty from Secrets Manager:${MISSING}"
          echo "       These are inlined into client bundles; building without them ships a broken client."
          exit 1
        fi

        # ---- ECR login -------------------------------------------------------------------------
        aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" \
          | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

        # Hand the resolved tag to the build phase (each buildspec command runs in its own shell).
        echo "${IMAGE_TAG}" > /tmp/image_tag

  build:
    commands:
      - |
        set -euo pipefail
        IMAGE_TAG="$(cat /tmp/image_tag)"
        IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"

        # Build args replicate .github/workflows/ecr-push-production.yml EXACTLY.
        #
        # The literals below are deliberately literals and must NOT be "improved" into secret
        # lookups: (a) deploy/Dockerfile's own ARG defaults still point at the DECOMMISSIONED
        # staging.blackouttrades.com domain, so every one of these must be passed explicitly or the
        # client is built against a dead host; (b) the secret's own NEXT_PUBLIC_SITE_URL is not
        # guaranteed to track the production origin. The five secret-sourced args above are the
        # only ones that legitimately come from Secrets Manager.
        docker build -f deploy/Dockerfile \
          --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" \
          --build-arg NEXT_PUBLIC_SITE_URL="https://blackouttrades.com" \
          --build-arg NEXT_PUBLIC_CLERK_IS_SATELLITE="false" \
          --build-arg NEXT_PUBLIC_CLERK_PROXY_URL="" \
          --build-arg NEXT_PUBLIC_CLERK_ALLOWED_REDIRECT_ORIGINS="https://blackouttrades.com" \
          --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_URL="/sign-in" \
          --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_URL="/sign-up" \
          --build-arg NEXT_PUBLIC_WHOP_CHECKOUT_MONTHLY="${NEXT_PUBLIC_WHOP_CHECKOUT_MONTHLY}" \
          --build-arg NEXT_PUBLIC_WHOP_CHECKOUT_YEARLY="${NEXT_PUBLIC_WHOP_CHECKOUT_YEARLY}" \
          --build-arg NEXT_PUBLIC_WHOP_CHECKOUT_COMMUNITY="${NEXT_PUBLIC_WHOP_CHECKOUT_COMMUNITY}" \
          --build-arg NEXT_PUBLIC_WHOP_STORE_URL="${NEXT_PUBLIC_WHOP_STORE_URL}" \
          --build-arg GITHUB_SHA="${IMAGE_TAG}" \
          -t "${IMAGE}:${IMAGE_TAG}" -t "${IMAGE}:latest" .

  post_build:
    commands:
      - |
        set -euo pipefail
        IMAGE_TAG="$(cat /tmp/image_tag)"
        IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"

        # Push the immutable SHA tag FIRST. If the push is interrupted between the two, :latest
        # still points at the previous good image rather than at a half-pushed manifest.
        docker push "${IMAGE}:${IMAGE_TAG}"
        docker push "${IMAGE}:latest"

        DIGEST="$(aws ecr describe-images \
          --repository-name "${ECR_REPOSITORY}" \
          --image-ids imageTag="${IMAGE_TAG}" \
          --region "${AWS_DEFAULT_REGION}" \
          --query 'imageDetails[0].imageDigest' --output text)"

        echo "Pushed ${IMAGE}:${IMAGE_TAG} and ${IMAGE}:latest"
        echo "Digest: ${DIGEST}"
        echo ""
        echo "NOT DEPLOYED. This pipeline builds and pushes only — rolling ECS is a separate,"
        echo "separately-authorized step. To deploy this image, roll blackout-production-web and"
        echo "blackout-production-market-worker onto ${IMAGE}:${IMAGE_TAG}."
