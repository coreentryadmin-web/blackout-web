# Railway config for Vector-Pick-Sweep cron.
[build]
builder = "nixpacks"
buildCommand = "echo 'cron trigger service: no app build needed'"
watchPatterns = [
  "scripts/hit-cron.mjs",
  "railway.vector-pick-sweep.toml",
  "nixpacks.toml",
]

[deploy]
startCommand = "node scripts/hit-cron.mjs /api/cron/vector-pick-sweep"
cronSchedule = "1-59/2 11-21 * * 1-5"
restartPolicyType = "never"
numReplicas = 1
