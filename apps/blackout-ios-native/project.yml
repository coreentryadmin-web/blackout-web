# XcodeGen spec — the source of truth for the native BlackOut iOS Xcode project.
#
# The .xcodeproj is INTENTIONALLY not committed; it's generated at build time
# from this YAML by `xcodegen generate`. Rationale:
#   1. project.pbxproj is a UUID-heavy XML file that produces enormous, unreadable
#      diffs on every change, which makes PR review of native changes miserable.
#   2. A YAML spec is language-server-friendly, diff-friendly, and unambiguous.
#   3. Regenerating from spec on each CI run guarantees the on-disk project
#      matches the spec — no hand-drift, no forgotten committed changes.
#
# Any developer with Xcode installed can regenerate locally:
#   $ brew install xcodegen && (cd apps/blackout-ios-native && xcodegen generate && open BlackOut.xcodeproj)
# CI does the same in .github/workflows/blackout-ios-native-ci.yml.

name: BlackOut
options:
  bundleIdPrefix: com.blackout-trades
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # xcodebuild build+test with CODE_SIGNING_ALLOWED=NO on macos-14 runners
  # (see the workflow) — no Apple certs required in CI. Signing rides the
  # existing apps/blackout-ios pipeline for TestFlight uploads until this
  # native app has its own signing story.

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "ZA32C782N5"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  BlackOut:
    type: application
    platform: iOS
    sources:
      - path: BlackOut
    resources:
      - path: BlackOut/Resources
        optional: true
    info:
      path: BlackOut/Info.plist
      # Load-bearing Info.plist keys. Face ID + push descriptors are permission
      # strings shown to the user and reviewer; app-transport-security is
      # locked to blackouttrades.com (no arbitrary loads) so the reviewer's
      # 4.2 "just a browser" question has an unambiguous answer.
      properties:
        CFBundleDisplayName: BlackOut
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSFaceIDUsageDescription: "BlackOut uses Face ID to unlock the desk securely without re-typing your password."
        NSHumanReadableCopyright: "© BLACKOUT TRADE LLC"
        LSApplicationCategoryType: public.app-category.finance
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIStatusBarHidden: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIBackgroundModes: [remote-notification]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            blackouttrades.com:
              NSIncludesSubdomains: true
              NSRequiresCertificateTransparency: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blackout-trades.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  BlackOutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BlackOutTests
    dependencies:
      - target: BlackOut
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blackout-trades.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BlackOut.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BlackOut"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  BlackOut:
    build:
      targets:
        BlackOut: [test, run, profile, analyze, archive]
    test:
      targets:
        - BlackOutTests
      gatherCoverageData: true
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
