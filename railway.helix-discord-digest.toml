# Railway/EventBridge catalog: HELIX Discord top-hits digests (15m / 30m embeds).
# Live fire requires EventBridge rule sync (TOML alone is not enough).
# Inert unless HELIX_DISCORD_ALERTS=1 and DISCORD_THERMAL_WEBHOOK_URL is set.
[build]
builder = "nixpacks"
buildCommand = "echo 'cron trigger service: no app build needed'"
watchPatterns = [
  "scripts/hit-cron.mjs",
  "railway.helix-discord-digest.toml",
  "nixpacks.toml",
]

[deploy]
startCommand = "CRON_HTTP_TIMEOUT_MS=120000 node scripts/hit-cron.mjs /api/cron/helix-discord-digest"
# Every 15 minutes Mon–Fri UTC 11–21 (~RTH band). Route also gates to cash RTH by default.
cronSchedule = "*/15 11-21 * * 1-5"
restartPolicyType = "never"
numReplicas = 1
