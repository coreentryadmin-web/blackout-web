# X desk autopost — even ET hours 8–20 (live SPX desk card + Whop footer).
# Schedule mirrors EventBridge: cron(0 12,14,16,18,20,22,0 ? * * *)
[build]
builder = "nixpacks"
buildCommand = "echo 'cron trigger service: no app build needed'"
watchPatterns = ["scripts/hit-cron.mjs", "railway.x-autopost.toml", "nixpacks.toml"]

[deploy]
startCommand = "node scripts/hit-cron.mjs /api/cron/x-autopost"
cronSchedule = "0 12,14,16,18,20,22,0 * * *"
restartPolicyType = "ON_FAILURE"
numReplicas = 1
