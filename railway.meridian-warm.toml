# Railway config for the Meridian-Warm cron service.
# Wire it up: service Settings -> Config-as-code -> set path to "railway.meridian-warm.toml"
# Requires CRON_SECRET on this service (same value as blackout-web).
[build]
builder = "nixpacks"
buildCommand = "echo 'cron trigger service: no app build needed'"
watchPatterns = [
  "scripts/hit-cron.mjs",
  "railway.meridian-warm.toml",
  "nixpacks.toml",
]

[deploy]
startCommand = "node scripts/hit-cron.mjs /api/cron/meridian-warm"
# Every 5 minutes during market hours — keeps Meridian timeline + SPX GEX + desk enrichment hot
cronSchedule = "*/5 * * * *"
restartPolicyType = "ON_FAILURE"
numReplicas = 1
