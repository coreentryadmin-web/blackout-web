# BLACKOUT PR Webhook — aggressive peer feedback on every PR activity
#
# Posts structured triage + MERGE/FIX/WAIT directive on EVERY PR event.
# Dispatches Cursor for deep peer review on ALL non-cursor PRs.
# Re-triages when CI completes. Sweeps open PRs every 15 min as backup.
# Requires: CURSOR_API_KEY

name: BLACKOUT PR webhook

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - closed
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to triage (omit to sweep all open PRs)"
        required: false

concurrency:
  # Triage comments are idempotent (update-in-place). Do not cancel in-flight runs —
  # cancelled jobs surface as red "triage" checks on main during merge waves.
  group: blackout-pr-${{ github.event.pull_request.number || github.event.inputs.pr_number || 'sweep' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'workflow_run' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Resolve PR number and event
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # toJson must not be spliced into node -e source — URL fields break JS parsing.
          PULL_REQUESTS_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.pr_number }}" ]; then
              echo "pr=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
              echo "event=workflow_dispatch" >> "$GITHUB_OUTPUT"
              echo "mode=single" >> "$GITHUB_OUTPUT"
            else
              echo "mode=sweep" >> "$GITHUB_OUTPUT"
              echo "event=workflow_dispatch" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=sweep" >> "$GITHUB_OUTPUT"
            echo "event=sweep" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            PR=$(node -e "
              const prs = JSON.parse(process.env.PULL_REQUESTS_JSON || '[]');
              console.log(prs?.[0]?.number ?? '');
            ")
            echo "pr=$PR" >> "$GITHUB_OUTPUT"
            echo "event=ci_completed" >> "$GITHUB_OUTPUT"
            echo "mode=single" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}" --jq '.pull_request.url // empty' | awk -F/ '{print $NF}')
            echo "pr=$PR" >> "$GITHUB_OUTPUT"
            echo "event=issue_comment" >> "$GITHUB_OUTPUT"
            echo "mode=single" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request_review" ]; then
            echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "event=${{ github.event.action }}" >> "$GITHUB_OUTPUT"
            echo "mode=single" >> "$GITHUB_OUTPUT"
          else
            echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "event=${{ github.event.action }}" >> "$GITHUB_OUTPUT"
            echo "mode=single" >> "$GITHUB_OUTPUT"
          fi

      - name: Sweep all open PRs (backup)
        if: steps.ctx.outputs.mode == 'sweep'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/blackout-agent/pr-feedback.mjs --sweep --lenient || {
            echo "::warning::PR sweep failed — non-blocking"
            exit 0
          }

      - name: Post/update PR feedback (triage comment)
        if: steps.ctx.outputs.mode == 'single'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ steps.ctx.outputs.pr }}
          GITHUB_EVENT_NAME: ${{ steps.ctx.outputs.event }}
        run: |
          [ -n "${GITHUB_PR_NUMBER:-}" ] || { echo "No PR — skip"; exit 0; }
          node scripts/blackout-agent/pr-feedback.mjs --lenient || {
            echo "::warning::PR feedback failed — non-blocking"
            exit 0
          }

      - name: Check if deep peer review dispatch needed
        id: dispatch
        if: steps.ctx.outputs.mode == 'single'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_NUMBER: ${{ steps.ctx.outputs.pr }}
          GITHUB_EVENT_NAME: ${{ steps.ctx.outputs.event }}
        run: |
          [ -n "${GITHUB_PR_NUMBER:-}" ] || { echo "want=false" >> "$GITHUB_OUTPUT"; exit 0; }
          RESULT=$(node scripts/blackout-agent/pr-dispatch-check.mjs 2>/dev/null) || RESULT='{"dispatch":false}'
          echo "$RESULT"
          echo "$RESULT" | node -e "
            let j = { dispatch: false, reviewer: '' };
            try { j = JSON.parse(require('fs').readFileSync(0,'utf8')); } catch {}
            console.log('want=' + (j.dispatch ? 'true' : 'false'));
            console.log('reviewer=' + (j.reviewer || ''));
          " >> "$GITHUB_OUTPUT" || echo "want=false" >> "$GITHUB_OUTPUT"

      - name: Launch Cursor for deep peer review
        if: steps.ctx.outputs.mode == 'single' && steps.dispatch.outputs.want == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_PR_NUMBER: ${{ steps.ctx.outputs.pr }}
          GITHUB_EVENT_NAME: ${{ steps.ctx.outputs.event }}
        run: |
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "CURSOR_API_KEY not set — triage posted, deep review agent skipped"
            exit 0
          fi
          PROMPT=$(node scripts/blackout-agent/pr-review-dispatch.mjs --pr="$GITHUB_PR_NUMBER" --event="$GITHUB_EVENT_NAME" 2>/dev/null) || PROMPT=""
          if [ -z "$PROMPT" ]; then
            echo "::warning::Could not build review dispatch prompt — skipping agent launch"
            exit 0
          fi
          export PROMPT
          payload=$(node -e "
            console.log(JSON.stringify({
              prompt: { text: process.env.PROMPT },
              repos: [{ url: 'https://github.com/coreentryadmin-web/blackout-web', startingRef: 'main' }],
              autoCreatePR: false
            }));
          " 2>/dev/null) || payload=""
          if [ -z "$payload" ]; then
            echo "::warning::Could not build agent payload — skipping agent launch"
            exit 0
          fi
          if ! resp=$(curl -sf -X POST https://api.cursor.com/v1/agents \
            -u "${CURSOR_API_KEY}:" \
            -H 'Content-Type: application/json' \
            -d "$payload"); then
            echo "::warning::Cursor agent launch failed — triage comment already posted, continuing"
            exit 0
          fi
          echo "$resp" | node -e "
            try {
              const r = JSON.parse(require('fs').readFileSync(0,'utf8'));
              const url = r.agent?.url ?? r.url ?? JSON.stringify(r);
              console.log('PR review agent launched:', url);
            } catch {
              console.log('PR review agent launched (unparsed response)');
            }
          " || true
          exit 0
