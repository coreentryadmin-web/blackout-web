# Build, sign, and ship the BlackOut iOS shell to TestFlight from a GitHub-hosted Mac.
#
# WHY this mirrors Codemagic: the codemagic-cli-tools (`app-store-connect`,
# `xcode-project`, `keychain`) are pip-installable and run on ANY Mac, so both CIs
# share ONE signing story via apps/blackout-ios/scripts/codemagic-signing.sh
# (fetch/create the distribution cert + App Store provisioning profile with the ASC
# API key, then `xcode-project use-profiles`). Codemagic (root codemagic.yaml) stays
# the primary path; this is the GitHub-hosted fallback / parallel path.
#
# Required GitHub Actions secrets (NAMES only — never commit values):
#   APP_STORE_CONNECT_ISSUER_ID   – ASC API key issuer UUID
#   APP_STORE_CONNECT_KEY_ID      – ASC API key identifier ("Key ID")
#   APP_STORE_CONNECT_PRIVATE_KEY – full contents of the AuthKey_XXXX.p8 (multi-line PEM)
# APPLE_TEAM_ID / BUNDLE_ID / the ASC app id are PUBLIC constants (already in
# codemagic.yaml and the repo), so they are hardcoded below rather than stored as secrets.

name: BlackOut iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      submit_to_external_testflight:
        description: "Also submit the uploaded build for EXTERNAL TestFlight beta review (needs a beta group). Off = internal TestFlight only."
        type: boolean
        default: false
      beta_group:
        description: "External TestFlight beta group name (only used when submit_to_external_testflight is true)."
        type: string
        default: ""
      probe_only:
        description: "Skip build; only probe ASC for current TestFlight build states (processingState, compliance, review status). Use when a build isn't emailing testers and you need to see WHY."
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "apps/blackout-ios/**"
      - ".github/workflows/blackout-ios-testflight.yml"

# Never run two builds of the same ref concurrently — an in-flight upload must finish
# before the next starts (avoids racing on the same TestFlight build number). Do NOT
# cancel-in-progress: killing a build mid-upload can leave a half-processed build in ASC.
concurrency:
  group: blackout-ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Probe-only path: skip validate-config + build-ios and just hit ASC to
  # dump every build's processingState, compliance answer, and beta-review
  # state. Used when we uploaded but the "Ready to test" email hasn't
  # fired and we need to see whether Apple is still processing, silently
  # holding on compliance, or the build failed post-upload validation.
  asc-probe:
    if: ${{ inputs.probe_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe ASC via API
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_APPLE_ID: "6787797476"
        run: |
          python3 -m pip install --quiet cryptography
          python3 - <<'PY'
          import base64, json, os, sys, time, urllib.request, urllib.error
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature

          def b64u(b): return base64.urlsafe_b64encode(b).rstrip(b"=").decode()

          issuer = os.environ["APP_STORE_CONNECT_ISSUER_ID"]
          key_id = os.environ["APP_STORE_CONNECT_KEY_ID"]
          pem    = os.environ["APP_STORE_CONNECT_PRIVATE_KEY"].encode()
          app_id = os.environ["APP_STORE_APPLE_ID"]

          header  = {"alg": "ES256", "kid": key_id, "typ": "JWT"}
          payload = {"iss": issuer, "exp": int(time.time()) + 1200, "aud": "appstoreconnect-v1"}
          signing = f"{b64u(json.dumps(header,separators=(',',':')).encode())}.{b64u(json.dumps(payload,separators=(',',':')).encode())}"
          pk = serialization.load_pem_private_key(pem, password=None)
          raw = pk.sign(signing.encode(), ec.ECDSA(hashes.SHA256()))
          r, s = decode_dss_signature(raw)
          sig = r.to_bytes(32, "big") + s.to_bytes(32, "big")
          jwt = f"{signing}.{b64u(sig)}"

          BASE = "https://api.appstoreconnect.apple.com/v1"
          H = {"Authorization": f"Bearer {jwt}"}

          def api(path):
              try:
                  with urllib.request.urlopen(urllib.request.Request(BASE + path, headers=H)) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  body = e.read().decode()[:400]
                  return e.code, {"error": body}

          # Users on the account — tells us which email addresses get the
          # "Ready to test" notification. Internal-tester notifications go
          # to team users with a role that includes internal testing (Admin,
          # App Manager, Developer). We list every user + their roles so we
          # can see WHICH Apple ID email actually receives the push/email.
          print(f"\n=== Users on the account (who gets TestFlight emails) ===\n")
          st, body = api(f"/users?limit=200")
          if st == 200:
              for u in body.get("data", []):
                  a = u.get("attributes", {})
                  email = a.get("username", "?")
                  name = f"{a.get('firstName','?')} {a.get('lastName','?')}".strip()
                  roles = ", ".join(a.get("roles", [])) or "?"
                  provs = "PROVISIONING" if a.get("provisioningAllowed") else "no-provisioning"
                  print(f"  {email:40}  {name:30}  [{roles}]  {provs}")
          else:
              print(f"  (users query failed → {st})")

          # Beta testers (specifically internal testers who receive builds)
          print(f"\n=== Beta testers on the account ===\n")
          st, body = api(f"/betaTesters?limit=200")
          if st == 200:
              testers = body.get("data", [])
              if not testers:
                  print("  (no beta testers configured — internal testers come from user roles)")
              for t in testers:
                  a = t.get("attributes", {})
                  print(f"  {a.get('email','?'):40}  {a.get('firstName','')} {a.get('lastName','')}  invitation={a.get('inviteType','?')}  state={a.get('state','?')}")
          else:
              print(f"  (betaTesters query failed → {st})")

          print(f"\n=== BlackOut TestFlight builds (app {app_id}) ===\n")
          st, body = api(f"/builds?filter[app]={app_id}&limit=8&sort=-uploadedDate")
          if st != 200:
              print(f"! /builds → {st}: {body}", file=sys.stderr); sys.exit(1)

          builds = body.get("data", [])
          if not builds:
              print("(no builds on the account yet)"); sys.exit(0)

          for b in builds:
              a = b.get("attributes", {})
              bid = b["id"]
              print(f"Build ID: {bid}")
              print(f"  Version:              {a.get('version', '?')}")
              print(f"  Uploaded:             {a.get('uploadedDate', '?')}")
              print(f"  Expires:              {a.get('expirationDate', '?')}")
              print(f"  Processing state:     {a.get('processingState', '?')}  ← INVALID/PROCESSING/VALID/FAILED")
              print(f"  Uses non-exempt enc:  {a.get('usesNonExemptEncryption', '?')}  (null = compliance NOT answered)")
              print(f"  Expired:              {a.get('expired', '?')}")
              print(f"  Icon asset token:     {'ok' if a.get('iconAssetToken') else 'MISSING'}")
              st2, body2 = api(f"/builds/{bid}/betaAppReviewSubmission")
              if st2 == 200 and body2.get("data"):
                  ba = body2["data"].get("attributes", {})
                  print(f"  Beta app review:      {ba.get('betaReviewState', '?')}")
              print()

          print("=" * 60)
          print("Interpretation guide:")
          print("  PROCESSING           → Apple still crunching. Wait 5-30 min.")
          print("  VALID + enc=null     → Build READY but silent 'Missing Compliance' hold.")
          print("                          Answer in ASC → TestFlight → Builds → the build →")
          print("                          'Manage Missing Compliance' → Yes / Yes-exempt.")
          print("                          (Future builds skip this — Info.plist patched.)")
          print("  VALID + enc=true|false → Live for internal testers. Email should have")
          print("                          fired within ~5 min of processing complete.")
          print("                          Check spam / Promotions folder.")
          print("  INVALID or FAILED    → Apple rejected the binary. Check the ASC dashboard")
          print("                          for the specific validation error.")
          PY

  # Cheap Linux lint of Capacitor/Codemagic config — no Xcode required. Kept from the
  # stub; gates the expensive Mac job so config drift fails fast and free.
  validate-config:
    if: ${{ inputs.probe_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/blackout-ios/package-lock.json
      # validate-config.mjs asserts `node_modules/typescript/package.json`
      # exists (capacitor.config.ts is a .ts file; on Codemagic the install
      # step runs before validation and hydrates that path). This job runs
      # BEFORE the expensive macOS job by design — so it must hydrate the
      # same node_modules the validator expects, or it fails on a check
      # that isn't a real config error.
      - name: Install iOS deps (for TS-config check)
        run: npm ci
        working-directory: apps/blackout-ios
      - name: Validate iOS config
        run: node apps/blackout-ios/scripts/validate-config.mjs

  build-ios:
    needs: validate-config
    # macos-15 image ships Xcode 26 alongside older versions. macos-14 was
    # pinned earlier but ships Xcode 15.4 (iOS 17.5 SDK) — Apple's April 2026
    # policy REJECTS any upload built with pre-iOS-26 SDK ("This app was
    # built with the iOS 17.5 SDK. All iOS and iPadOS apps must be built
    # with the iOS 26 SDK or later"). Bumping the image + explicitly
    # xcode-selecting Xcode 26 below is the only way through.
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/blackout-ios
    env:
      # PUBLIC constants — mirror codemagic.yaml exactly. validate-codemagic-env.mjs
      # (invoked by codemagic-signing.sh) hard-asserts APPLE_TEAM_ID + BUNDLE_ID, so a
      # typo here fails the signing preflight with a clear message instead of a cryptic
      # "no matching signing certificate for team" later.
      BUNDLE_ID: "com.blackout-trades.app"
      APPLE_TEAM_ID: "ZA32C782N5"
      XCODE_WORKSPACE: "ios/App/App.xcworkspace"
      XCODE_SCHEME: "App"
      APP_STORE_APPLE_ID: "6787797476"
      # ASC API key: the codemagic CLI auto-reads these EXACT env var names for
      # --issuer-id / --key-id / --private-key. APP_STORE_CONNECT_PRIVATE_KEY carries
      # the .p8 PEM content directly (multi-line secret is preserved through `env:`),
      # and the CLI reads the key from this env var — no separate key file is written.
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      # Apple April 2026 policy: uploads must be built with Xcode 26+ /
      # iOS 26 SDK+. macos-15 ships several Xcode 26.x versions in
      # /Applications but does NOT provide an unversioned Xcode_26.app
      # symlink (previous round 7 failed on that assumption). Pick the
      # highest available Xcode_26.x.y.app on the runner — sort -V handles
      # both `26.0.app` and `26.2.1.app` correctly. Fails LOUD if no
      # Xcode 26 is present, listing what IS there.
      - name: Select newest Xcode 26 (Apple SDK-26 upload policy)
        run: |
          set -euo pipefail
          XCODE_APP=$(ls -1d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE_APP" ]; then
            echo "ERROR: No Xcode 26.x found on this runner." >&2
            ls -1 /Applications | grep -i '^Xcode' || true
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Fail fast if ASC API key secrets are missing
        run: |
          set -eu
          fail=0
          [ -n "${APP_STORE_CONNECT_ISSUER_ID:-}" ]   || { echo "Missing secret APP_STORE_CONNECT_ISSUER_ID" >&2; fail=1; }
          [ -n "${APP_STORE_CONNECT_KEY_IDENTIFIER:-}" ] || { echo "Missing secret APP_STORE_CONNECT_KEY_ID" >&2; fail=1; }
          [ -n "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ] || { echo "Missing secret APP_STORE_CONNECT_PRIVATE_KEY" >&2; fail=1; }
          [ "$fail" -eq 0 ] || { echo "Add the missing secret(s): repo Settings -> Secrets and variables -> Actions." >&2; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/blackout-ios/package-lock.json

      # Clean CPython avoids the macOS system-Python PEP 668 "externally-managed"
      # pip failure and puts app-store-connect / xcode-project / keychain on PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codemagic-cli-tools
        run: pip3 install codemagic-cli-tools

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project (Capacitor)
        run: |
          set -euo pipefail
          # Capacitor appId has no hyphens; the Apple bundle id is patched in after sync.
          if [ ! -f ios/App/App.xcodeproj/project.pbxproj ]; then
            npx cap add ios
          fi
          npx cap sync ios
          node scripts/patch-ios-bundle-id.mjs
          # Answer the export-compliance question upfront so TestFlight
          # doesn't silently withhold the build behind a "Missing
          # Compliance" flag that requires manual dashboard clicking.
          # See patch-ios-info-plist.mjs header for the full rationale.
          node scripts/patch-ios-info-plist.mjs

      - name: Generate app icon + splash (native asset sets from assets/)
        run: npm run assets:generate

      - name: Set a unique TestFlight build number
        run: |
          set -euo pipefail
          # CFBundleVersion must strictly increase per upload or ASC rejects the build
          # ("bundle version must be higher than previously uploaded"). Pick the next
          # value above BOTH the latest processed TestFlight build and this run number.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          NEW="$GITHUB_RUN_NUMBER"
          if [ "$LATEST" -ge "$NEW" ]; then NEW=$((LATEST + 1)); fi
          echo "Latest TestFlight build=$LATEST, run=$GITHUB_RUN_NUMBER -> CFBundleVersion=$NEW"
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          # Capacitor's Info.plist sets CFBundleVersion to $(CURRENT_PROJECT_VERSION),
          # so bumping the build setting propagates to the IPA. sed mirrors the repo's
          # own patch-ios-bundle-id.mjs (BSD sed on macOS needs the `-i ''` form).
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = ${NEW};/g" "$PBX"
          grep -q "CURRENT_PROJECT_VERSION = ${NEW};" "$PBX" || { echo "Failed to set CURRENT_PROJECT_VERSION in $PBX" >&2; exit 1; }

      - name: Set up code signing (fetch/create cert + profile via ASC API key)
        run: bash scripts/codemagic-signing.sh

      - name: Install CocoaPods
        run: cd ios/App && pod install

      - name: Build signed IPA
        run: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Upload to TestFlight
        env:
          SUBMIT_EXTERNAL: ${{ inputs.submit_to_external_testflight }}
          BETA_GROUP: ${{ inputs.beta_group }}
        run: |
          set -euo pipefail
          # `app-store-connect publish` uploads the IPA to App Store Connect; once Apple
          # finishes processing it is available to INTERNAL TestFlight testers with no
          # further step. --testflight (-t) additionally submits the build for EXTERNAL
          # beta review into the named group (Apple review required for external testers).
          args=(--path 'build/ios/ipa/*.ipa')
          if [ "${SUBMIT_EXTERNAL:-false}" = "true" ]; then
            if [ -z "${BETA_GROUP:-}" ]; then
              echo "submit_to_external_testflight=true requires a beta_group input." >&2
              exit 1
            fi
            args+=(--testflight --beta-group "$BETA_GROUP")
            echo "Uploading + submitting to EXTERNAL TestFlight group '$BETA_GROUP'"
          else
            echo "Uploading to App Store Connect (INTERNAL TestFlight only)"
          fi
          app-store-connect publish "${args[@]}"

      - name: Upload build artifacts (IPA + xcodebuild logs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blackout-ios-ipa
          if-no-files-found: warn
          retention-days: 14
          path: |
            apps/blackout-ios/build/ios/ipa/*.ipa
            /tmp/xcodebuild_logs/*.log
