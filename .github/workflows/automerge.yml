name: Auto-merge agent PRs

# Hands-off merging for agent PRs.
#
# When a NON-DRAFT pull request from an agent branch (`cursor/*` or `claude/*`) is opened
# or updated, this enables GitHub's native auto-merge so the PR merges ITSELF the moment
# the required `verify` check (see ci.yml) goes green — no human click required.
#
# ── WHY `claude/*` IS LISTED (added 2026-08-21, after a 36-PR jam) ────────────────────────
#
# This workflow was written for the Cursor agent and its branch prefix was hardcoded. When
# the Claude agent fleet came online it used `claude/*`, and nothing here matched — so 36
# agent PRs accumulated, 28 of them with `verify` GREEN, and not one could ever merge.
#
# The jam was invisible because it looked like two unrelated problems. Nothing FAILED: no
# red check, no error, no complaint. The PRs simply sat, and the natural reading was "the
# agents are stuck" or "the connection to the agents broke" — when the agents had finished
# their work correctly and handed it over exactly as asked.
#
# TWO independent conditions were failing at once, which is why fixing either alone would
# have kept the jam in place:
#   1. the branch prefix (`cursor/` only), and
#   2. the draft gate — the agent harness instructs every agent to open its PR as a DRAFT,
#      while the repo policy in CLAUDE.md says "do not auto-merge draft PRs". Those two
#      standing instructions are individually sensible and jointly a deadlock: every agent
#      PR is born in a state policy forbids merging, and no agent ever leaves that state.
#
# The draft gate is deliberately KEPT. Draft is the agent's own "still working" signal, and
# auto-undrafting here would merge work the moment CI passes even if the agent had more to
# push. Resolving it belongs one level up: the coordinator reviews a green draft and marks
# it ready, at which point `ready_for_review` fires this workflow and the merge proceeds.
# What changed is only that the mechanism now RUNS for Claude branches — a PR marked ready
# no longer lands in a workflow that silently ignores it.
#
# Gating still applies: the `cursor-merge` branch ruleset on `main` requires the
# `verify` status check, so nothing merges until CI passes. Auto-merge simply removes
# the manual "Enable auto-merge" click.
#
# Scope: only agent branches (`cursor/*`, `claude/*`). Human PRs from other branches are
# untouched and still merge manually.
#
# Token: the built-in GITHUB_TOKEN is sufficient for the current ruleset (0 required
# approvals). If approvals are ever required, swap in a PAT/app token that can approve.
#
# ── SILENT NO-DEPLOY: GITHUB_TOKEN MERGES DON'T TRIGGER DOWNSTREAM WORKFLOWS (2026-08-24) ──
#
# GitHub's documented anti-recursion rule: an event created by the default GITHUB_TOKEN
# inside a workflow run does not trigger ANY other workflow (push-triggered CI, CodeQL,
# ecr-push-production.yml — nothing). This workflow's merge step used GITHUB_TOKEN, so
# every PR it auto-merged landed on `main` with NO verify re-run and NO production deploy,
# silently. Nothing failed — the merge commit just never fired a single downstream run.
#
# Measured twice same-day on the SAME lane (#2783, #2796 — both `claude/largo-53p3kg`,
# both merged by `github-actions[bot]` via this workflow): zero check-runs beyond the
# no-op `collect-and-dispatch`, and the last successful `ecr-push-production.yml` run
# stayed pinned to an earlier commit while real `src/lib/largo/**` changes sat undeployed
# on `main`. Every merge done manually via the GitHub API/MCP (a real user identity, not
# GITHUB_TOKEN) fired CI/deploy correctly in the same window — that contrast is what
# isolated the cause. Caught only because the coordinator re-checked `main`'s HEAD sha
# against the deploy workflow's last-run sha rather than trusting the merge itself.
#
# Fix: use `AGENT_RELEASE_TOKEN` (the same PAT `agent-pr-release.yml` already uses to
# undraft PRs, since GITHUB_TOKEN is refused that too) for the merge step specifically —
# a PAT is a real identity, so its push events trigger downstream workflows normally.
# Falls back to GITHUB_TOKEN if the secret is unset (existing behavior, still silent on
# deploy — better than erroring the whole workflow over a missing optional secret).
#
# Prerequisites (one-time): repo Settings → General → Pull Requests → "Allow auto-merge"
# must be ON, and the `cursor-merge` ruleset must require the `verify` check.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    if: ${{ !github.event.pull_request.draft && (startsWith(github.head_ref, 'cursor/') || startsWith(github.head_ref, 'claude/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Skip docs-only agent PRs (verify-pass spam)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=$(gh pr diff "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --name-only)
          if [ -z "$files" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No diff files — skipping auto-merge"
            exit 0
          fi
          non_docs=$(echo "$files" | grep -v '^docs/' || true)
          if [ -z "$non_docs" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only PR — skipping auto-merge (verify agents must not land docs-only PRs)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge (squash) — merges once `verify` passes
        if: steps.gate.outputs.skip != 'true'
        env:
          # AGENT_RELEASE_TOKEN so the merge event fires downstream workflows (CI/deploy) —
          # GITHUB_TOKEN merges are invisible to push-triggered workflows, see note above.
          GH_TOKEN: ${{ secrets.AGENT_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash \
            "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"
