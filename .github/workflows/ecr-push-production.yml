# Build production Docker image and push to ECR (:latest).
# Clerk auth — NOT Cognito. (Staging was decommissioned 2026-07-25.)
name: ECR push (production)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deploy/Dockerfile"
      - ".dockerignore"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "public/**"
      - ".github/workflows/ecr-push-production.yml"

# Serialize production deploys and let the NEWEST win. Without this, rapid back-to-back merges to main
# launch overlapping deploys that race each other: an earlier deploy's post-roll "Validate static assets"
# step checks the origin AFTER a later deploy has already swapped the _next/* chunk hashes out from under
# it, so it validates against assets that no longer exist and FALSE-FAILS (observed 2026-07-23: #973/#974
# deploys red on the static-asset step, ECS actually rolled fine; only the unraced #975 passed). Cancelling
# the in-progress older run means only the latest commit deploys — the final ECS state is always the newest
# code, the smoke check runs unraced, and a red deploy once again means a REAL failure (no cry-wolf).
#
# CANCEL -> QUEUE (2026-08-19). The reasoning above is right that overlapping deploys must not race;
# it is wrong that CANCELLING is how you stop them, and the difference is a member-visible outage.
#
# `aws ecs update-service --force-new-deployment` (below) is ASYNCHRONOUS. Cancelling this workflow
# does not roll ECS back and does not stop the rollout — it only stops WATCHING it, and skips every
# post-roll step: the stability wait, the static-asset validation, the Cloudflare HTML purge and the
# worker roll. So a cancelled deploy still ships its image, unattended and unverified.
#
# Worse, the next merge then issues ANOTHER force-new-deployment while the previous rollout is still
# in flight, so ECS runs overlapping deployments and the service serves tasks from SEVERAL builds at
# once. Measured 2026-08-18: five merges in ~30 minutes produced four cancelled deploys, and a probe
# of prod /vector caught the consequence — the page self-reloading plus
# `TypeError: Cannot read properties of undefined (reading 'call')`, which is webpack asking a
# loaded chunk for a module factory that build does not contain. Old HTML + a different build's
# chunks is exactly what a multi-build fleet serves.
#
# Queueing gives the SAME non-overlap guarantee the comment above wanted — GitHub still runs only
# one job in this group at a time, so the static-asset check is still never raced — while letting
# each rollout finish and get its purge and validation. Intermediate merges are cancelled while
# PENDING, which is harmless: a pending run has not issued update-service, so it cannot leave a
# partial rollout behind. The final ECS state is still the newest commit.
#
# Cost is honest: the newest commit waits for the current deploy instead of pre-empting it, so a
# burst of merges reaches prod later. That is the right trade against serving three builds at once.
concurrency:
  group: ecr-push-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.repository == 'coreentryadmin-web/blackout-web'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          REPO="${ECR_REPOSITORY:-blackout-web}"
          if [ -z "${REGISTRY:-}" ]; then
            echo "ECR login failed — set AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION"
            exit 1
          fi
          IMAGE="${REGISTRY}/${REPO}"
          docker build -f deploy/Dockerfile \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
            --build-arg NEXT_PUBLIC_SITE_URL="https://blackouttrades.com" \
            --build-arg NEXT_PUBLIC_CLERK_IS_SATELLITE="false" \
            --build-arg NEXT_PUBLIC_CLERK_PROXY_URL="" \
            --build-arg NEXT_PUBLIC_CLERK_ALLOWED_REDIRECT_ORIGINS="https://blackouttrades.com" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_URL="/sign-in" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_URL="/sign-up" \
            --build-arg NEXT_PUBLIC_WHOP_CHECKOUT_MONTHLY="${{ secrets.NEXT_PUBLIC_WHOP_CHECKOUT_MONTHLY }}" \
            --build-arg NEXT_PUBLIC_WHOP_CHECKOUT_YEARLY="${{ secrets.NEXT_PUBLIC_WHOP_CHECKOUT_YEARLY }}" \
            --build-arg NEXT_PUBLIC_WHOP_CHECKOUT_COMMUNITY="${{ secrets.NEXT_PUBLIC_WHOP_CHECKOUT_COMMUNITY }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_ADS_ID="${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_ID }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_ADS_LABEL_SIGNUP="${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_LABEL_SIGNUP }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_ADS_LABEL_PURCHASE="${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_LABEL_PURCHASE }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_ADS_LABEL_PRICING_VIEW="${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_LABEL_PRICING_VIEW }}" \
            --build-arg NEXT_PUBLIC_WHOP_STORE_URL="${{ secrets.NEXT_PUBLIC_WHOP_STORE_URL }}" \
            --build-arg GITHUB_SHA="${{ github.sha }}" \
            -t "${IMAGE}:${IMAGE_TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:latest"
          echo "Pushed ${IMAGE}:${IMAGE_TAG} and :latest"

      - name: Roll ECS production web
        env:
          ECS_CLUSTER: blackout-production-cluster
          ECS_SERVICE: blackout-production-web
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          REPO="${ECR_REPOSITORY:-blackout-web}"
          FULL_IMAGE="${REGISTRY}/${REPO}:${IMAGE_TAG}"

          # Get the current task definition from the service
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query 'services[0].taskDefinition' --output text)
          echo "Current task definition: ${TASK_DEF_ARN}"

          # Fetch task def, rewrite image tags to the SHA-pinned build,
          # and strip any secrets refs for keys missing from Secrets Manager.
          # The immutable SHA tag avoids stale :latest resolution after failed
          # deployments; the secrets filter avoids ResourceInitializationError
          # when Terraform-generated task defs reference removed keys.
          aws ecs describe-task-definition \
            --task-definition "${TASK_DEF_ARN}" \
            --query 'taskDefinition' > /tmp/taskdef.json

          # Extract the secret ARN from the task def so we can validate keys
          SECRET_ARN=$(python3 -c "
          import json
          with open('/tmp/taskdef.json') as f:
              td = json.load(f)
          for c in td.get('containerDefinitions', []):
              for s in c.get('secrets', []):
                  # valueFrom format: arn:...:secret-name:KEY::
                  arn = ':'.join(s['valueFrom'].split(':')[:-3])
                  print(arn)
                  break
              break
          ")
          echo "Secret ARN: ${SECRET_ARN}"

          # Fetch actual keys present in the Secrets Manager JSON
          aws secretsmanager get-secret-value \
            --secret-id "${SECRET_ARN}" \
            --query 'SecretString' --output text | python3 -c "
          import json, sys
          keys = sorted(json.load(sys.stdin).keys())
          with open('/tmp/valid-secret-keys.json', 'w') as f:
              json.dump(keys, f)
          print(f'Found {len(keys)} valid secret keys')
          "

          python3 - "${FULL_IMAGE}" /tmp/taskdef.json /tmp/new-taskdef.json /tmp/valid-secret-keys.json <<'PYEOF'
          import json, sys
          new_image = sys.argv[1]
          src, dst, keys_file = sys.argv[2], sys.argv[3], sys.argv[4]
          with open(src) as f:
              td = json.load(f)
          with open(keys_file) as f:
              valid_keys = set(json.load(f))
          for c in td.get("containerDefinitions", []):
              c["image"] = new_image
              orig = c.get("secrets", [])
              filtered = [s for s in orig if s["name"] in valid_keys]
              removed = [s["name"] for s in orig if s["name"] not in valid_keys]
              if removed:
                  print(f"Stripped stale secret refs: {removed}")
              c["secrets"] = filtered
              # KEEP_ALIVE_TIMEOUT (ms) is ENFORCED here, on every deploy, and must EXCEED the ALB
              # idle timeout (120s). Node's default is 5s, so the target closes sockets the ALB
              # still considers reusable -> the ALB sends a request into a half-closed connection
              # and answers 502 ITSELF. Measured 2026-08-07: HTTPCode_ELB_5XX 11-26/min while
              # HTTPCode_Target_5XX was 1 in 35 min, TargetConnectionErrorCount 0 and all targets
              # healthy -- the app never saw those requests, so nothing in its logs or its
              # healthcheck could ever reveal them.
              #
              # This lives in the WORKFLOW, not in a hand-applied task-def revision, because the
              # rewrite below re-derives the task def from whatever the service currently points
              # at. A revision patched by hand is silently dropped by the next merge -- which is
              # exactly what happened: rev 602 carried the fix, CI shipped 603 without it minutes
              # later, and the 502s never stopped.
              env = [e for e in c.get("environment", []) if e["name"] != "KEEP_ALIVE_TIMEOUT"]
              env.append({"name": "KEEP_ALIVE_TIMEOUT", "value": "125000"})
              c["environment"] = env
          for k in ["taskDefinitionArn", "revision", "status",
                     "requiresAttributes", "compatibilities",
                     "registeredAt", "registeredBy", "deregisteredAt"]:
              td.pop(k, None)
          with open(dst, "w") as f:
              json.dump(td, f)
          PYEOF

          echo "Rewriting image to: ${FULL_IMAGE}"

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/new-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered new task definition: ${NEW_ARN}"

          # Do NOT pass --desired-count here: auto-scaling manages the task count. Overriding it
          # resets the count on every deploy and fights the scaling target. The live scalable
          # target is min 5 / max 12 (verified 2026-08-06 via
          # `aws application-autoscaling describe-scalable-targets --resource-ids
          #  service/blackout-production-cluster/blackout-production-web`). The FLOOR of 5 is
          # load-bearing for the arithmetic below — re-check it before touching these numbers.
          #
          # ── Rolling strategy: minHealthy=100 / max=120. DO NOT "optimize" either number. ──
          # Guarded by src/lib/ecs-deploy-config.test.ts, which re-derives the arithmetic below
          # from THIS line across every task count in [5,12] and fails CI if it stops holding.
          #
          # WHY minHealthy=100 (was 50): this service takes live member traffic, and
          # minimumHealthyPercent is the floor of healthy tasks ECS must hold DURING a deploy
          # (% of desiredCount, rounded UP). At 50 a deploy was permitted to drain the fleet to
          # HALF *before* any replacement was healthy — 6 of 12 tasks, or 3 of 5 — because ECS
          # is allowed to satisfy a roll by removing capacity first. On 2026-08-06 the service
          # was already capacity-constrained and a deploy on 50 deepened the incident (5xx
          # ~4.5%). At 100 ECS must bring a replacement to healthy BEFORE it stops anything, so
          # a deploy can only ever add capacity to a saturated fleet, never subtract it.
          #
          # WHY max had to move 112 → 120 (this is the subtle half): maximumPercent is the
          # ceiling on RUNNING+PENDING tasks (% of desiredCount, rounded DOWN). With
          # minHealthy=100 the roll can only progress if that ceiling grants a spare slot —
          # floor(desired * max/100) >= desired + 1 — because ECS may no longer free a slot by
          # stopping a task first. Scanning the REAL autoscaling range for deadlocks:
          #   max=112 → deadlocks at desired = 5, 6, 7, 8   (floor(8*1.12) = 8, not 9)
          #   max=115 → deadlocks at desired = 5, 6
          #   max=117 → deadlocks at desired = 5
          #   max=120 → deadlocks NOWHERE in [5,12]          ← why 120
          # The binding case is the autoscaling FLOOR: floor(5 * 1.20) = 6, one spare slot. At
          # anything below 120, floor(5 * M/100) = 5 → ceiling 5 with minHealthy 5, so ECS can
          # neither start a replacement nor stop an old task: the deployment makes ZERO progress
          # and hangs until the poller below times out. desired=5 is exactly where the service
          # sits overnight and at weekends — i.e. where unattended deploys land.
          # (The comment that used to live here claimed 112 gave "at most 9 tasks on an 8-task
          # service". That arithmetic was wrong — floor(8*1.12) is 8, not 9 — and that error is
          # why 50 looked load-bearing: with no spare slot, draining first was the only way ECS
          # could move at all.)
          #
          # WHY NOT HIGHER — the Fargate On-Demand vCPU quota (L-3032A538) is 30 in this
          # account; the increase to 100 is CASE_OPENED, NOT granted. Web tasks are 2 vCPU;
          # blackout-production-market-worker is 2 tasks x 1 vCPU = 2 vCPU. At the autoscaling
          # max (desired=12) there are two different peaks and only one of them must fit:
          #   REQUIRED for the roll to progress: 13 tasks * 2 = 26, + worker 2 = 28 vCPU <= 30 ✓
          #   PERMITTED by the ceiling: floor(12*1.20) = 14 tasks * 2 = 28, + 2 = 30 vCPU
          # Landing the PERMITTED peak exactly on the quota is safe: the 14th task is optional
          # headroom, so if the quota blocks its placement the roll still completes on 13. The
          # real ceiling is max >= 125 → floor(12*1.25) = 15 tasks = 32 vCPU, which is OVER
          # quota and must not ship. Usable window is therefore max ∈ [120, 124]; 120 is chosen
          # as the smallest value that clears every deadlock.
          #
          # AND NOTE — the autoscaling floor cannot be lowered below 5 while the quota is 30:
          # desired=4 would need max >= 125 to avoid deadlocking, and that same max permits 15
          # tasks (32 vCPU) at desired=12. If the min capacity is ever reduced, this whole block
          # must be re-solved (the test will fail loudly first).
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${NEW_ARN}" \
            --deployment-configuration "minimumHealthyPercent=100,maximumPercent=120,deploymentCircuitBreaker={enable=true,rollback=true}" \
            --force-new-deployment

          # Custom stability check: poll the PRIMARY deployment only.
          # The built-in `services-stable` waiter blocks on ALL deployments
          # including stale circuit-breaker leftovers that can never stabilize.
          #
          # Budget raised 12 min → 36 min as a REQUIRED companion to minHealthy=100 above, not
          # as an unrelated tweak. Under the old 50/112 ECS could free ~half the fleet at once
          # and then start replacements in ~2 big waves. With minHealthy=100 it can only work
          # through the spare slots the ceiling grants — just ONE for most of the autoscaling
          # range (desired 5-9), and at most two at the top — so tasks are replaced
          # near-serially. Each cycle is task start + image pull + Next boot + ALB health checks
          # + the old task's 30s deregistration drain (~2 min), so a 12-task roll is ~24-30 min
          # of legitimate rolling. Budget the serial worst case: leaving it at 12 min would
          # red-fail every healthy deploy on timeout AND abort the job before the Cloudflare
          # purge / static-asset validation / worker roll steps below ever run. A genuinely
          # broken rollout still fails FAST (the circuit breaker flips rolloutState=FAILED and
          # the loop exits 1 on the next tick), and `concurrency: cancel-in-progress` means a
          # newer merge cancels a slow older run.
          echo "Waiting for PRIMARY deployment to stabilize (up to 36 min)..."
          for i in $(seq 1 144); do
            sleep 15
            STATUS=$(aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --query 'services[0].deployments[?status==`PRIMARY`] | [0]' \
              --output json)
            P_RUNNING=$(echo "${STATUS}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('runningCount',0))")
            P_DESIRED=$(echo "${STATUS}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('desiredCount',0))")
            P_ROLLOUT=$(echo "${STATUS}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('rolloutState','UNKNOWN'))")
            echo "  [${i}/144] PRIMARY: running=${P_RUNNING}/${P_DESIRED}, rollout=${P_ROLLOUT}"
            if [ "${P_ROLLOUT}" = "COMPLETED" ]; then
              echo "ECS rollout complete."
              break
            fi
            if [ "${P_ROLLOUT}" = "FAILED" ]; then
              echo "ECS rollout FAILED."
              exit 1
            fi
            # NO `running == desired` SHORTCUT.
            #
            # It used to break here, and it is why the static-asset gate below failed every
            # deploy. PRIMARY reaching running==desired means all the NEW tasks are up — it does
            # NOT mean the fleet converged, because the OLD deployment's tasks are still
            # registered in the target group and still serving until they drain.
            #
            # Measured on the 2026-08-12 08:0x roll (5 tasks, maximumPercent 120,
            # minimumHealthyPercent 100, so strictly one-at-a-time):
            #
            #   PRIMARY running == desired (5/5 new up) ~07:49
            #   static-asset gate ran its 5 min window    07:49 -> 07:55 FAIL
            #   last old task finished draining           08:01
            #   rolloutState = COMPLETED                  08:02
            #
            # So the shortcut exited the wait ~13 minutes early and handed the gate a fleet that
            # was still half old by construction. The gate then reported RED on a deploy that had
            # in fact shipped fine — the exact false-alarm that teaches everyone to ignore a red
            # deploy. `rolloutState` is the only signal that means what we need; ROLLING services
            # with the circuit breaker enabled always report it, so there is nothing to fall back
            # to. If it is ever genuinely absent we time out loudly rather than guess.
            if [ "${P_ROLLOUT}" = "UNKNOWN" ] && [ "${P_RUNNING}" = "${P_DESIRED}" ] && [ "${P_DESIRED}" != "0" ]; then
              echo "No rolloutState reported by ECS; falling back to running == desired."
              break
            fi
            if [ "$i" = "144" ]; then
              echo "Timed out waiting for PRIMARY deployment to stabilize."
              exit 1
            fi
          done

      # Purge the edge BEFORE validating. The validator fetches the site THROUGH
      # Cloudflare, and Cloudflare edge-caches the transient 404s that hashed
      # /_next/static/* chunks throw during the rolling task swap. If we validate
      # first, those cached 404s fail the check for the full retry window and the
      # job exits 1 *before* this purge ever runs — so the stale/404 edge cache is
      # never cleared and the deploy is marked failed even though ECS rolled out
      # fine. Purge → then validate against a cleared edge that re-fetches the
      # now-healthy origin. (Guard lives in the script, not `if:`, because
      # step-scoped `env` is not reliably in scope for that step's own `if`.)
      - name: Purge Cloudflare edge cache
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CF_ZONE_ID}" ] || [ -z "${CF_API_TOKEN}" ]; then
            echo "Cloudflare secrets not set — skipping edge purge."
            exit 0
          fi
          # PURGE HTML ONLY — NEVER /_next/static/*.
          #
          # This was `purge_everything`, and it was manufacturing the outage it could not recover
          # from. Next.js build assets are CONTENT-HASHED and served
          # `cache-control: public, max-age=31536000, immutable` — a given URL's bytes can never
          # change, so they never need purging. Purging them forces every client to re-fetch from an
          # origin that, mid-rollout, is a MIX of old and new ECS tasks: HTML from a new task
          # referencing `webpack-<newhash>.js`, whose request lands on a task that only has the old
          # build, returns 404. Next serves that 404 as `text/plain`, the browser refuses to execute
          # it, HYDRATION NEVER COMPLETES, and every client component sits frozen in its loading
          # state with no error and no retry.
          #
          # Observed on prod 2026-08-18: a captured session showed "Loading chart…", "Loading 0dte
          # matrix…" and "Connecting Live Helix…" all stuck simultaneously with 84/84 network
          # requests succeeding, and the console carrying
          # `Refused to execute script from '.../webpack-bbf5e95de4d12e67.js' because its MIME type
          # ('text/plain') is not executable`. That exact URL returned 200 / cf-cache-status HIT
          # ~8 minutes later, once the edge had re-cached a good copy — i.e. it self-heals, which is
          # why the failure reads as intermittent and unreproducible.
          #
          # The layout.tsx chunk-reload guard cannot save this: it reloads at most 3 times, 8s apart,
          # and while the fleet is mixed a reload can land on a bad task again, so it exhausts and
          # leaves the member on a dead page.
          #
          # Leaving hashed assets cached is what lets the OLD and NEW builds coexist during a
          # rollout — a client holding old HTML keeps getting its old chunks from the edge while new
          # clients get the new ones. That is the entire point of immutable content-hashed URLs.
          # Only HTML must be purged, and only the routes that are edge-cached at all (see the
          # cache rule in CLAUDE.md: `/`, `/upgrade`, `/learn*`; every desk page is already DYNAMIC).
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://blackouttrades.com/","https://blackouttrades.com/upgrade","https://blackouttrades.com/learn","https://blackouttrades.com/pricing","https://blackouttrades.com/faq"]}'
          echo "Cloudflare HTML purged after ECS rollout (hashed build assets deliberately retained)."
          # Let the edge drop entries before we validate through it.
          sleep 10

      # WHY THIS IS PATIENT *AND* STRICTER THAN IT LOOKS (2026-08-12).
      #
      # This gate failed a real deploy on 2026-08-12: 10 attempts x 15s = 2.5 minutes was not
      # enough for the ECS fleet to converge, so four merged fixes sat in `main` while production
      # kept serving the previous build for ~25 minutes. Nothing surfaced that — every PR reported
      # green. A re-run with no code change passed, which is the signature of a timing race, not a
      # broken build.
      #
      # The race: during a rolling deploy the ALB has BOTH builds behind it. A page served by a new
      # task references chunk hashes only the new build has; the follow-up request for that chunk
      # can land on an old task and 404. It resolves itself once every task is new — it just takes
      # longer than 2.5 minutes.
      #
      # So the window is now 20 x 15s = 5 minutes. And because the same mixed fleet can also make a
      # SINGLE probe pass by luck (both requests happening to hit new tasks), one pass is no longer
      # enough: it requires TWO CONSECUTIVE passes. That costs 15s on a healthy deploy and removes
      # the false GREEN, which is the more dangerous of the two failures — a false RED is loud, a
      # false GREEN ships a half-rolled fleet.
      - name: Validate static assets on origin
        run: |
          set -euo pipefail
          streak=0
          for i in $(seq 1 20); do
            if node scripts/validate-static-assets.mjs; then
              streak=$((streak + 1))
              if [ "$streak" -ge 2 ]; then
                echo "Static asset check passed twice in a row — fleet has converged."
                exit 0
              fi
              echo "Attempt $i/20 passed (streak $streak/2) — confirming once more in 15s..."
            else
              # Reset: a failure means the fleet is still mixed, so any earlier pass was luck.
              if [ "$streak" -gt 0 ]; then echo "Streak broken — fleet still mixed."; fi
              streak=0
              echo "Attempt $i/20 failed — retrying in 15s..."
            fi
            sleep 15
          done
          echo "Static assets still broken after ECS rollout (5 minutes, needed 2 consecutive passes)."
          exit 1

      # Roll the market-worker LAST — after web has fully rolled, been edge-purged,
      # and validated — so this additive step never delays the user-facing web deploy
      # and a worker failure can't roll back web.
      #
      # WHY THIS STEP EXISTS (it is NOT redundant with "Roll ECS production web"):
      # this pipeline previously rolled ONLY blackout-production-web, so the separate
      # blackout-production-market-worker service's task def was updated only by hand and
      # ROTTED between manual touches — (1) its pinned image tag eventually got pruned by
      # the ECR lifecycle policy → CannotPullContainerError, and (2) its secrets[] kept
      # referencing keys later removed from Secrets Manager (e.g. NEXT_PUBLIC_WHOP_CHECKOUT_LIFETIME)
      # → ResourceInitializationError. Both took the worker DOWN (runningCount 0/1). This step
      # mirrors the web roll's generic fix — repin the image to the freshly-built SHA and strip
      # stale secret refs — on every deploy, so the worker tracks web and can never rot again.
      - name: Roll ECS production market-worker
        env:
          ECS_CLUSTER: blackout-production-cluster
          ECS_SERVICE: blackout-production-market-worker
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          REPO="${ECR_REPOSITORY:-blackout-web}"
          FULL_IMAGE="${REGISTRY}/${REPO}:${IMAGE_TAG}"

          # Get the current task definition from the service
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query 'services[0].taskDefinition' --output text)
          echo "Current worker task definition: ${TASK_DEF_ARN}"

          # Fetch task def, rewrite image tags to the SHA-pinned build, and strip any
          # secrets refs for keys missing from Secrets Manager — identical generic logic
          # to the web roll. The worker runs the SAME image as web (same repo, same SHA);
          # only its command/role/env differ and those already live in the task def, so we
          # swap ONLY `image` and strip stale secrets, nothing else.
          aws ecs describe-task-definition \
            --task-definition "${TASK_DEF_ARN}" \
            --query 'taskDefinition' > /tmp/worker-taskdef.json

          # Re-derive the secret ARN from the WORKER's OWN task def (self-contained — do
          # not depend on the web step's /tmp/valid-secret-keys.json). Worker and web point
          # at the same Secrets Manager secret, but deriving it here keeps this step robust
          # in isolation even if the web step is reordered or removed.
          SECRET_ARN=$(python3 -c "
          import json
          with open('/tmp/worker-taskdef.json') as f:
              td = json.load(f)
          for c in td.get('containerDefinitions', []):
              for s in c.get('secrets', []):
                  # valueFrom format: arn:...:secret-name:KEY::
                  arn = ':'.join(s['valueFrom'].split(':')[:-3])
                  print(arn)
                  break
              break
          ")
          echo "Worker secret ARN: ${SECRET_ARN}"

          # Fetch actual keys present in the Secrets Manager JSON
          aws secretsmanager get-secret-value \
            --secret-id "${SECRET_ARN}" \
            --query 'SecretString' --output text | python3 -c "
          import json, sys
          keys = sorted(json.load(sys.stdin).keys())
          with open('/tmp/worker-valid-secret-keys.json', 'w') as f:
              json.dump(keys, f)
          print(f'Found {len(keys)} valid secret keys')
          "

          python3 - "${FULL_IMAGE}" /tmp/worker-taskdef.json /tmp/worker-new-taskdef.json /tmp/worker-valid-secret-keys.json <<'PYEOF'
          import json, sys
          new_image = sys.argv[1]
          src, dst, keys_file = sys.argv[2], sys.argv[3], sys.argv[4]
          with open(src) as f:
              td = json.load(f)
          with open(keys_file) as f:
              valid_keys = set(json.load(f))
          for c in td.get("containerDefinitions", []):
              c["image"] = new_image
              orig = c.get("secrets", [])
              filtered = [s for s in orig if s["name"] in valid_keys]
              removed = [s["name"] for s in orig if s["name"] not in valid_keys]
              if removed:
                  print(f"Stripped stale secret refs: {removed}")
              c["secrets"] = filtered
          for k in ["taskDefinitionArn", "revision", "status",
                     "requiresAttributes", "compatibilities",
                     "registeredAt", "registeredBy", "deregisteredAt"]:
              td.pop(k, None)
          with open(dst, "w") as f:
              json.dump(td, f)
          PYEOF

          echo "Rewriting worker image to: ${FULL_IMAGE}"

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/worker-new-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered new worker task definition: ${NEW_ARN}"

          # Do NOT pass --desired-count: the worker is a singleton (desiredCount=1)
          # configured on the service; overriding it on every deploy fights that config.
          #
          # Rolling strategy: minHealthy=0 / max=200. Live shape (verified 2026-08-06):
          # desiredCount=2, each task 1024 CPU units = 1 vCPU (2 vCPU for the tier).
          #
          # DELIBERATELY NOT CHANGED to minHealthy=100 when the WEB service was moved to 100
          # (2026-08-06). The two services want OPPOSITE things, and the reason is LEADER
          # ELECTION, not replica count:
          #  * Web is a horizontally-scaled request tier. Every task serves traffic, so capacity
          #    is additive and dropping below desiredCount during a deploy is a member-facing
          #    outage. It wants 100.
          #  * This worker's capacity is NOT additive. It runs PROCESS_ROLE=ingest, and exactly
          #    ONE replica holds each upstream market-data WebSocket at a time, arbitrated by a
          #    fenced Redis SETNX lock (src/lib/ws/leader-lock-fencing.ts). Non-leaders open
          #    NOTHING by design — that is forced by the upstreams, which permit one live socket
          #    per API key: src/lib/ws/uw-socket.ts:165 (UW "streams to only ONE WebSocket per
          #    API key"; extra contenders get silence, not an error, and "the whole cluster goes
          #    dark during RTH") and src/lib/ws/polygon-socket.ts:136 (Massive "allows at most 1
          #    live WebSocket per API key", 2nd+ rejected with code 1008). The 2nd replica is a
          #    warm standby for fast failover, not extra throughput.
          # So minimumHealthyPercent buys this tier nothing: what must stay available is the
          # LOCK HOLDER, and Redis arbitrates that, not the ECS task count. Worse, forcing
          # overlap with minHealthy=100 makes the ingest gap LONGER: an incoming task boots
          # while an old one still holds the lease, loses the SETNX, opens nothing, and then
          # waits out its own 15s UW_RECONCILE_INTERVAL_MS tick after the old task finally
          # releases. At minHealthy=0 the outgoing task's SIGTERM releases the lock first
          # (closeAllDataSockets → releaseFencedLock) and the incoming task's IMMEDIATE first
          # reconcile wins it. Circuit breaker + rollback stays enabled so a bad task def
          # auto-reverts instead of leaving the tier at 0 running. Leave this at 0/200.
          #
          # OPEN QUESTION for the infra owner (surfaced 2026-08-06, deliberately NOT acted on
          # here): now that desiredCount is 2 rather than 1, minHealthy=0 permits ECS to drain
          # BOTH replicas before either replacement is healthy, which would leave the leader
          # lock unheld for a full task-start cycle. minHealthy=50 would keep one leader-eligible
          # replica alive at all times WITHOUT forcing the pathological overlap that 100 does.
          # That is a real availability question, but it is a change to ingest failover
          # behaviour and belongs in its own PR with its own verification — not bundled into a
          # web-tier capacity fix.
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${NEW_ARN}" \
            --deployment-configuration "minimumHealthyPercent=0,maximumPercent=200,deploymentCircuitBreaker={enable=true,rollback=true}" \
            --force-new-deployment

          # Custom stability check: poll the PRIMARY deployment only (same rationale as web —
          # the built-in services-stable waiter blocks on stale circuit-breaker leftovers that
          # can never stabilize).
          echo "Waiting for worker PRIMARY deployment to stabilize (up to 12 min)..."
          for i in $(seq 1 48); do
            sleep 15
            STATUS=$(aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --query 'services[0].deployments[?status==`PRIMARY`] | [0]' \
              --output json)
            P_RUNNING=$(echo "${STATUS}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('runningCount',0))")
            P_DESIRED=$(echo "${STATUS}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('desiredCount',0))")
            P_ROLLOUT=$(echo "${STATUS}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('rolloutState','UNKNOWN'))")
            echo "  [${i}/48] worker PRIMARY: running=${P_RUNNING}/${P_DESIRED}, rollout=${P_ROLLOUT}"
            if [ "${P_ROLLOUT}" = "COMPLETED" ]; then
              echo "Worker ECS rollout complete."
              break
            fi
            if [ "${P_ROLLOUT}" = "FAILED" ]; then
              echo "Worker ECS rollout FAILED."
              exit 1
            fi
            # Same false early-exit as the web wait above — see the long note there. PRIMARY
            # reaching running==desired means the new tasks are up, not that the old ones are
            # gone, so this reported the worker rolled while it was still rolling. Nothing
            # validates after this step, so the cost here is a false GREEN on the deploy rather
            # than a false RED — which is the more dangerous of the two, and exactly the failure
            # mode that let market-worker task-def rot go unnoticed before.
            if [ "${P_ROLLOUT}" = "UNKNOWN" ] && [ "${P_RUNNING}" = "${P_DESIRED}" ] && [ "${P_DESIRED}" != "0" ]; then
              echo "No rolloutState reported by ECS; falling back to running == desired."
              break
            fi
            if [ "$i" = "48" ]; then
              echo "Timed out waiting for worker PRIMARY deployment to stabilize."
              exit 1
            fi
          done
