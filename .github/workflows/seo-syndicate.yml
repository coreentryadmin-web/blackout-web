# Canonical-safe article syndication — drips one BlackOut Academy guide per day to Dev.to and
# Hashnode, each with a canonical pointing back to our own page (so syndication adds reach without
# cannibalizing our rankings). Runs on GitHub's IP, which — unlike the audit sandbox — is not
# tripped by Hashnode's Cloudflare bot-challenge, so both platforms post from here.
#
# Idempotent: the script reads what each account already published and skips anything already
# syndicated, so re-runs never double-post and the drip naturally stops once the corpus is covered.
# Keys are read from Secrets Manager (blackout-production/marketing/{devto,hashnode}); never logged.
name: SEO article syndication

on:
  schedule:
    # Once a day, 15:05 UTC — paced so it reads as an author, not a spam importer.
    - cron: "5 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would post without posting"
        type: boolean
        default: false
      limit:
        description: "Articles per platform this run"
        default: "1"
  pull_request:
    paths:
      - scripts/seo/syndicate-articles.mjs
      - .github/workflows/seo-syndicate.yml

jobs:
  syndicate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # On a PR, always dry-run (never post from a PR). On schedule, real post. On manual, honor input.
      - name: Syndicate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          else
            DRY=""
          fi
          LIMIT="${{ inputs.limit }}"
          node --import tsx scripts/seo/syndicate-articles.mjs --platform=both --limit="${LIMIT:-1}" $DRY
