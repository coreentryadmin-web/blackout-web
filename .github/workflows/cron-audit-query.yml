# Prod cron_job_runs audit — scheduled + manual.
name: Cron audit query

on:
  schedule:
    # Hourly during RTH UTC band (11–21 UTC ≈ 7AM–5PM ET)
    - cron: "5 11-21 * * 1-5"
    # Off-hours spot check (aligned with off-hours-health)
    - cron: "5 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/cron-audit-query.mjs
      - .github/workflows/cron-audit-query.yml

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

