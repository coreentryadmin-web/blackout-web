# 0DTE Command + Market Grid — all-day RTH Cloud Agent (verify + post-close fix)
#
# Re-enabled 2026-09-03 with autopilot bootstrap + no docs/ PR spam on verify passes.
# Runbook: docs/ops/GRID-RTH-ALL-DAY-AGENT.md

name: Grid RTH all-day agent

on:
  schedule:
    - cron: "30 13 * * 1-5"
    - cron: "30 14 * * 1-5"
    - cron: "45 13 * * 1-5"
    - cron: "45 14 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "0 16 * * 1-5"
    - cron: "30 16 * * 1-5"
    - cron: "30 17 * * 1-5"
    - cron: "0 18 * * 1-5"
    - cron: "0 19 * * 1-5"
    - cron: "30 19 * * 1-5"
    - cron: "30 20 * * 1-5"
    - cron: "55 19 * * 1-5"
    - cron: "55 20 * * 1-5"
    - cron: "5 20 * * 1-5"
    - cron: "5 21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Agent mode"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - fix

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Determine agent mode
        id: mode
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.mode }}"
          if [ -n "$INPUT" ]; then
            echo "mode=$INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SCHEDULE='${{ github.event.schedule }}'
          case "$SCHEDULE" in
            "5 20 * * 1-5"|"5 21 * * 1-5") echo "mode=fix" >> "$GITHUB_OUTPUT" ;;
            *) echo "mode=verify" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Start Cloud Agent (Grid all-day)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          AGENT_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "CURSOR_API_KEY not set — skipping."
            exit 0
          fi
          BOOTSTRAP=$(node scripts/blackout-agent/dispatch-prompt.mjs --agent=cursor)
          if [ "$AGENT_MODE" = "fix" ]; then
            EXTRA='Grid post-close fix. Read docs/ops/GRID-RTH-ALL-DAY-AGENT.md Step 4. Run validate:grid-rth --phase=post-close, validate:zerodte-logic, validate:grid-e2e. Claim tasks first. CODE PRs only.'
            AUTO_PR=true
          else
            EXTRA='Grid RTH verify. Run validate:grid-rth, validate:zerodte-logic, validate:grid-e2e. Summary only — no docs/ commits on verify passes.'
            AUTO_PR=false
          fi
          PROMPT="${BOOTSTRAP}

${EXTRA}"
          payload=$(node -e "
            console.log(JSON.stringify({
              prompt: { text: process.env.PROMPT },
              repos: [{ url: 'https://github.com/coreentryadmin-web/blackout-web', startingRef: 'main' }],
              autoCreatePR: process.env.AUTO_PR === 'true'
            }));
          ")
          resp=$(curl -sf -X POST https://api.cursor.com/v1/agents \
            -u "${CURSOR_API_KEY}:" \
            -H 'Content-Type: application/json' \
            -d "$payload")
          echo "$resp" | node -e "
            const r = JSON.parse(require('fs').readFileSync(0,'utf8'));
            console.log('Grid agent (' + process.env.AGENT_MODE + '):', r.agent?.url ?? r.url);
          "
