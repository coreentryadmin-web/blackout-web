name: Largo stress nightly

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  largo-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Run live Largo stress (all banks)
        env:
          LARGO_STRESS_LIVE: "1"
          LARGO_STRESS_BANK: all
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run validate:largo-stress-live-all
      - name: Open ops issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `ops-auto-fix: Largo nightly stress failed (${new Date().toISOString().slice(0,10)})`;
            const body = `Nightly \`validate:largo-stress-live-all\` failed. Check workflow run: ${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["ops-auto-fix", "largo"],
            });
