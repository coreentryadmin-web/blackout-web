name: Largo stress nightly

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      bank:
        description: "Bank to run (1-4, or all for full sweep — manual only)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "1"
          - "2"
          - "3"
          - "4"
          - all

# Required for the "Open ops issue on failure" step's github.rest.issues.create — without this,
# the default GITHUB_TOKEN has no issue-write scope and that step itself fails silently (a second,
# compounding failure on top of whatever broke the stress run), which is exactly how a real
# ERR_MODULE_NOT_FOUND regression (PR #3203/#3219) went unreported for hours: the workflow run
# failed, but no ops-auto-fix issue was ever opened to alert anyone. Matches the same
# contents:read/issues:write pattern ops-auto-fix.yml already uses for its own issue creation.
permissions:
  contents: read
  issues: write

jobs:
  largo-stress:
    runs-on: ubuntu-latest
    # Scheduled / manual single-bank: concurrency=2 (lowered from 5 by #4073 to cut Clerk/UW 429
    # storms — do not raise this back to 5, see largo-stress-nightly-timeout-budget.test.ts).
    # Banks are NOT evenly sized (bankStats(): ~100-193 questions) — the budget below must cover
    # the LARGEST bank at concurrency=2, not an average one. MEASURED 2026-09-26 (run 36239606676,
    # bank1, 109 questions, completed in full): 35.65min live-phase wall clock = ~0.327min/question
    # at concurrency=2. Bank3 (193 questions, the largest) projects to ~63min at that rate — the
    # previous "fits 45m... at concurrency 5" comment here was simply wrong for this path (it had
    # been running at concurrency=2 since #4073, not 5, and nobody re-measured the budget against
    # the real per-bank sizes) and run 35996805744 (bank3, 2026-09-24) was cancelled by this exact
    # timeout at 44m45s mid-sweep, auto-filing ops-auto-fix #5485. 90m gives bank3 real margin
    # (~27min / ~43%) without reverting the #4073 concurrency mitigation.
    # Manual `bank=all`: full 523-question sweep needs the separate, much longer 360m window.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bank == 'all' && 360 || 90 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Resolve nightly bank + concurrency
        id: scope
        run: |
          if [ "${{ github.event.inputs.bank }}" = "all" ]; then
            echo "bank=all" >> "$GITHUB_OUTPUT"
            echo "concurrency=5" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.bank }}" ]; then
            echo "bank=${{ github.event.inputs.bank }}" >> "$GITHUB_OUTPUT"
            echo "concurrency=2" >> "$GITHUB_OUTPUT"
          else
            BANK=$(node scripts/largo-stress-nightly-bank.mjs)
            echo "bank=${BANK}" >> "$GITHUB_OUTPUT"
            echo "concurrency=2" >> "$GITHUB_OUTPUT"
          fi
      - name: Run live Largo stress
        env:
          LARGO_STRESS_LIVE: "1"
          LARGO_STRESS_BANK: ${{ steps.scope.outputs.bank }}
          LARGO_STRESS_CONCURRENCY: ${{ steps.scope.outputs.concurrency }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node --import tsx scripts/largo-stress-run.mjs
      # The full per-question report (every live answer's preview + issue tags, not just the
      # console summary) is the only way to tell a genuine BAD answer from a scorer false positive
      # after the fact — investigating #5502/#5578 (2026-09-26, 2026-10-01) without it meant
      # reasoning from truncated console `preview` text that was never actually printed, only
      # written to this file. Kept short-retention since it's a debugging aid, not an audit record.
      - name: Upload stress report on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: largo-stress-report-${{ github.run_id }}
          path: audit-output/largo-stress-report*.json
          if-no-files-found: ignore
          retention-days: 14
      # `if: failure()` alone does NOT catch a timeout: `timeout-minutes: 45` above kills the
      # previous step with conclusion `cancelled`, not `failure`, so `failure()` is false and this
      # step used to be silently SKIPPED. Measured 2026-08-31: 15 of the last 19 scheduled runs
      # (2026-08-13 through 08-31) ended `cancelled` at the 45-minute wall — the DOMINANT outcome,
      # not an edge case — and NONE of them ever opened an ops-auto-fix issue. `LARGO_STRESS_BANK=all`
      # runs 523 questions at the harness's own concurrency=1, ~20-90s each (some runs also hit a
      # Clerk FAPI re-establish throttle partway through that never recovers, burning the remainder
      # of the run on immediate 401/SKIP) — structurally can't finish in 45 minutes, so this is not
      # a rare flake this alert exists to catch, it is the modal run. This gap is exactly the same
      # silent-failure shape the `issues: write` permissions fix above (this same file) was written
      # to close — that fix only helps once this step actually RUNS. See docs/audit/findings-staging
      # for the timeout root-cause writeup (why 45min/all-banks is structurally undersized) — this
      # change restores alerting only; it does not change the timeout budget or run scope.
      - name: Open ops issue on failure
        if: failure() || cancelled()
        uses: actions/github-script@v9
        with:
          script: |
            const title = `ops-auto-fix: Largo nightly stress failed (${new Date().toISOString().slice(0,10)})`;
            const body = `Nightly \`validate:largo-stress-live-all\` failed or was cancelled (a timeout-minutes wall being reached is one possible cause among several — a single BAD-scored live answer also fails this job; see the uploaded \`largo-stress-report-*\` artifact on this run, if one was attached, for the per-question detail). Check workflow run: ${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["ops-auto-fix", "largo"],
            });
