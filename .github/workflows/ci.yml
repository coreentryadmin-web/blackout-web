name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (rapid pushes / PR syncs) to save minutes.
# main pushes use a unique group so deploy-gating runs are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Throwaway Postgres for the SQL-EXECUTION tests. FINDINGS 2026-08-06 (SEV-1): the swing
    # live-state UPDATE shipped unparseable (42P08 — a param whose first occurrence was an untyped
    # `IS NOT NULL`) and every existing guard passed, because they all regex-match the SQL SOURCE
    # STRING and a statement that cannot be parsed still matches its own text. Only a real
    # extended-protocol round-trip catches that class of defect. Tests that need it read
    # SWING_TEST_DATABASE_URL and SKIP (never fail) when it is absent, so local runs are unaffected.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # FULL HISTORY, ON PURPOSE. `src/findings-no-loss.test.ts` asserts that no FINDINGS entry
      # present in the merge base has been deleted, and it can only do that if the base commit is
      # in the local object store. The default fetch-depth of 1 leaves it unresolvable, at which
      # point the guard SKIPS — and a guard that silently skips is the exact failure it exists to
      # catch (PR #2552 dropped five findings past a hygiene suite that passed 8/8).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: API auth guard (default-deny)
        run: node scripts/verify-api-auth-guards.mjs
      - name: Tailwind @apply opacity guard (recurring build breaker)
        run: node scripts/check-tailwind-apply-opacity.mjs
      - name: Client/server boundary guard (recurring build breaker)
        # Sits BEFORE the tests on purpose. A "use client" module that reaches `import "server-only"`
        # fails `next build` and nothing else — tsc is clean and the unit suite passes — so without
        # this the feedback only arrives at the LAST step, ~4 minutes in. Same placement rationale
        # as the tailwind guard directly above.
        run: node scripts/audit/client-server-boundary.mjs
      - name: Unit tests
        # Same entrypoint a developer runs (`npm test`), so a local pass means this pass. The glob
        # is expanded inside the script rather than by the shell — Node 20 does not expand globs in
        # --test, and having CI work around that in bash is what made the two runs diverge.
        env:
          SWING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/verify
        run: npm test
      - name: Build (next build — catches deploy-breakers before merge)
        run: npm run build
      - name: Brand guard (no grey)
        run: npm run lint:brand
      - name: Vendor surface guard (no provider names in UI)
        run: npm run lint:vendor
      - name: Accessibility lint (jsx-a11y, non-blocking)
        run: npm run lint
        continue-on-error: true
      - name: Stylelint (non-blocking)
        run: npm run lint:css
        continue-on-error: true
