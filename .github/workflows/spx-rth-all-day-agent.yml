# SPX Slayer — all-day RTH Cloud Agent (verify + post-close fix)
#
# Re-enabled 2026-09-03 — verify passes are summary-only (no docs/ PR spam).
# Fix pass still opens code PRs post-close. Runbook: docs/ops/SPX-RTH-ALL-DAY-AGENT.md

name: SPX RTH all-day agent

on:
  schedule:
    # --- VERIFY passes (ET) — dual cron covers EDT + EST ---
    - cron: "28 13 * * 1-5"
    - cron: "28 14 * * 1-5"
    - cron: "40 13 * * 1-5"
    - cron: "40 14 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "0 16 * * 1-5"
    - cron: "30 16 * * 1-5"
    - cron: "30 17 * * 1-5"
    - cron: "0 18 * * 1-5"
    - cron: "0 19 * * 1-5"
    - cron: "30 19 * * 1-5"
    - cron: "30 20 * * 1-5"
    - cron: "55 19 * * 1-5"
    - cron: "55 20 * * 1-5"
    # --- FIX pass: 16:05 ET post-close (~1:05 PM PT) ---
    - cron: "5 20 * * 1-5"
    - cron: "5 21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Agent mode"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - fix

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Determine agent mode
        id: mode
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.mode }}"
          if [ -n "$INPUT" ]; then
            echo "mode=$INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SCHEDULE='${{ github.event.schedule }}'
          case "$SCHEDULE" in
            "5 20 * * 1-5"|"5 21 * * 1-5") echo "mode=fix" >> "$GITHUB_OUTPUT" ;;
            *) echo "mode=verify" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Start Cloud Agent (SPX all-day)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          AGENT_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "CURSOR_API_KEY not set — skipping agent launch."
            echo "Create Cursor Automations from docs/ops/SPX-RTH-ALL-DAY-AGENT.md (starts 6:30 AM PT)"
            exit 0
          fi

          if [ "$AGENT_MODE" = "fix" ]; then
            PROMPT='SPX Slayer post-close fix agent (~1:05 PM PT). Read docs/ops/SPX-RTH-ALL-DAY-AGENT.md Section Step 6 completely. Run npm run validate:spx-rth -- --phase=post-close AND npm run validate:spx-e2e. Fix EVERY SPX finding from today: every matrix cell GEX/VEX, desk/pulse/flow cache lanes, play confirmations, Thermal/HELIX/Largo/Grid/0DTE/BIE integration. Branch fix/<slug>, test, PR with CODE fixes only, merge, validate:deploy. Repeat until validate:spx-rth AND validate:spx-e2e are zero FAIL. Do NOT open PRs that only touch docs/. Do NOT ask the user.'
            AUTO_PR=true
          else
            PROMPT='SPX Slayer RTH verify (scheduled). Read docs/ops/SPX-RTH-ALL-DAY-AGENT.md verify mode. Run npm run validate:spx-rth then npm run validate:spx-e2e. Report PASS/FAIL counts and top failures in the agent summary ONLY — no repo commits on green or yellow verify passes. Do NOT edit docs/api-audit/OPEN-ISSUES.md, docs/audit/FINDINGS.md, or any docs/ path during verify. Fix P0 code bugs only (fix/<slug> PR with src/ changes, autoCreatePR allowed for that case). Do NOT ask the user.'
            AUTO_PR=false
          fi
          export PROMPT
          export AUTO_PR

          payload=$(node -e "
            console.log(JSON.stringify({
              prompt: { text: process.env.PROMPT },
              repos: [{ url: 'https://github.com/coreentryadmin-web/blackout-web', startingRef: 'main' }],
              autoCreatePR: process.env.AUTO_PR === 'true'
            }));
          ")

          resp=$(curl -sf -X POST https://api.cursor.com/v1/agents \
            -u "${CURSOR_API_KEY}:" \
            -H 'Content-Type: application/json' \
            -d "$payload")

          echo "$resp" | node -e "
            const r = JSON.parse(require('fs').readFileSync(0,'utf8'));
            const url = r.agent?.url ?? r.url ?? '(see response)';
            console.log('SPX Cloud Agent started (' + process.env.AGENT_MODE + '):', url);
          "
