# Scheduled dependency hygiene for a fintech/auth surface (Clerk, Whop, svix, pg, ws).
# Dependabot opens PRs on `dependabot/*` branches, so the `cursor/*`-scoped automerge
# workflow does NOT auto-merge them — they get human review (intended).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # Batch low-risk patch/minor bumps to cut PR noise; majors stay individual.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # svix >=2.2.0 (through the latest published 2.5.0, checked 2026-09-11) ships a
      # Webhook.verify() that silently drops its return value — `this.inner.verify(...)`
      # is called but never `return`ed, and the method's own type signature was changed
      # to `: undefined` to match. 2.1.0 (currently pinned) still has `return
      # this.inner.verify(...)`. This is a real regression in svix's shipped dist, not a
      # types-only mismatch: our route.ts's `evt = wh.verify(...) as WebhookEvent` cast
      # is what surfaces it as a `tsc` error (bumped versions correctly refuse to let
      # `undefined` masquerade as `WebhookEvent`) — but silencing that error with a wider
      # cast (`as unknown as WebhookEvent`) would NOT be a fix: `evt` would be `undefined`
      # at runtime on every webhook call, and `const { type, data } = evt` would throw,
      # breaking Clerk user.created/user.updated processing (tier sync, welcome emails)
      # entirely. See docs/audit/findings-staging/2026-09-11-svix-2.2-verify-drops-return-value.md
      # for the confirmed root cause (traced through svix's actual published dist across
      # 2.1.0/2.2.0/2.3.0/2.5.0). Without this, dependabot keeps re-bundling the broken
      # bump into the shared minor-and-patch group every week, blocking ~14 otherwise-safe
      # updates behind one library only upstream can fix. Remove this once svix ships a
      # patched verify() that returns the parsed payload again.
      - dependency-name: "svix"
        versions: [">=2.2.0"]
      # tsx >=4.23.10 (through the latest published 4.23.13, checked 2026-09-11) throws
      # `TypeError [Error]: Invalid URL` / `ERR_INVALID_URL` inside tsx's OWN ESM resolver
      # hook (node_modules/tsx/dist/register-*.mjs) when running this repo's test suite on
      # Node 20 with `--experimental-test-module-mocks` — not a flake: every test FILE hit
      # aborts entirely (not a per-assertion failure), and 4.23.1 (pinned today) runs clean.
      # This is the THIRD independent recurrence of the identical failure: first documented
      # at 4.23.10 (CLAUDE.md's own environment notes, PR #2073, 133 files down), fixed again
      # by hand at 4.23.12 (commit 34978b360, "hold tsx at 4.23.1 — the group bump breaks 89
      # test files under Node 20"), and now again at 4.23.13 in PR #4812 (152 failures) — the
      # prior two fixes each manually stripped tsx from that week's group bump but never added
      # an ignore rule, so dependabot kept re-proposing the same broken range every week and
      # blocking the other ~13-14 unrelated, genuinely-safe updates behind it each time. See
      # docs/audit/findings-staging/2026-09-11-tsx-4.23.10-invalid-url-recurring-dependabot-block.md
      # for the full evidence trail. Remove this once a tsx release confirms the resolver fix
      # (re-test the exact failure — `npx tsx --experimental-test-module-mocks --test
      # src/lib/zerodte/scan.test.ts` on Node 20 — before lifting it, not just a changelog read).
      - dependency-name: "tsx"
        versions: [">4.23.1"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    labels:
      - dependencies
      - github-actions
