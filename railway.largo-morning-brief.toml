# Largo morning brief — 9:25 AM ET weekdays (dual UTC band for DST)
# Wire via sync-cron-schedules.mjs / EventBridge

[build]
builder = "NIXPACKS"
buildCommand = "echo 'cron trigger service: no app build needed'"
watchPatterns = [
  "scripts/hit-cron.mjs",
  "railway.largo-morning-brief.toml",
  "nixpacks.toml",
]

[deploy]
startCommand = "node scripts/hit-cron.mjs /api/cron/largo-morning-brief"
restartPolicyType = "NEVER"
# 13:25 UTC = 9:25 ET during EDT; 14:25 UTC = 9:25 ET during EST — mirrors
# railway.nighthawk-morning-confirm.toml's dual-band convention.
cronSchedule = "25 13,14 * * 1-5"
numReplicas = 1
