# Cron config for the Night-Hawk-Swing-Discovery cron service.
# Wire it up: service Settings -> Config-as-code -> set path to "railway.swing-discovery.toml"
# Requires CRON_SECRET on this service (same value as blackout-web).
#
# ROOT CAUSE THIS FILE CLOSES (the empty SWING board): the swing-discovery ROUTE, discovery core,
# accumulation write (upsertSwingAccum), contract-attach (fetchChainRows), and the persist->read
# snapshot (persistSwingServingSnapshot -> discoverSwingFromPersisted) were all wired, but this cron
# was NEVER added to the EventBridge schedule catalog (the railway.*.toml files blackout-infra syncs).
# With no schedule, the route never fired in prod, so:
#   - persistSwingServingSnapshot was never called -> the "swing:serving:latest:v1" shared-cache blob
#     was never written -> discoverSwingFromPersisted returned null -> getSwingServingLane served the
#     member-safe EMPTY lane (0 committed / 0 watch, all day, every day since PR-13/#1046); and
#   - upsertSwingAccum was never called -> zero accumulation rows -> nothing ever reached the >=2
#     distinct-session persistence bar, so the WATCH rail would stay empty even after one fire.
# Adding this TOML makes the route schedulable; blackout-infra's EventBridge sync then provisions the
# trigger. (Merging this file does NOT itself fire EventBridge — the infra sync is a deliberate step.)
[build]
builder = "nixpacks"
buildCommand = "echo 'cron trigger service: no app build needed'"
# Only redeploy this trigger service when its OWN driver/config changes — NOT on docs/src/log commits.
# This service only runs scripts/hit-cron.mjs — ALL business logic lives in the blackout-web app it
# pings — so it only needs to redeploy when hit-cron.mjs or this TOML changes. Mirrors railway.toml's
# proven repo-relative-glob watchPatterns (a leading-slash "/**" matches NOTHING on Railway).
watchPatterns = [
  "scripts/hit-cron.mjs",
  "railway.swing-discovery.toml",
  "nixpacks.toml",
]

[deploy]
startCommand = "node scripts/hit-cron.mjs /api/cron/swing-discovery"
# Phase-anchored, WIDE-BAND fire — the route decides (scan-cadence.ts). The route resolves the active
# discovery PHASE from the ET wall clock (etMinutesOfDay handles DST via the tz db) and runs ONCE per
# (session day, phase); every off-phase firing self-skips (decideSwingScan -> run:false) and every
# re-fire inside a phase is an idempotent no-op (atomic Redis claim). So a coarse every-30-min weekday
# band robustly lights up all five ET phases in BOTH EDT and EST without any DST math here:
#   POST_CLOSE 16:15-20:00 ET (primary, ships first) · PRE_OPEN 06:00-09:15 · MIDDAY 12:00-13:00 ·
#   POWER_HOUR 15:00-16:00 · OVERNIGHT 20:00-24:00 ET.
# Off-phase fires are cheap (a pure decide -> skip, no scan). The `1-5` day-of-week is UTC; the only
# uncovered sliver is the EST-only tail of Friday OVERNIGHT that lands 01:00-05:00 UTC Saturday — an
# as-yet-unshipped (primary:false) phase, so an acceptable, documented gap. POST_CLOSE (the primary
# phase) fires at 20:15+ UTC (EDT) / 21:15+ UTC (EST), both the same UTC weekday, so it is never missed.
# NOTE: if cronSchedule was set in the dashboard UI, the dashboard value overrides this TOML — update
# it there too.
cronSchedule = "*/30 * * * 1-5"
restartPolicyType = "ON_FAILURE"
numReplicas = 1
