# Railway config for the Helix-Signal-Outcomes cron service.
# Wire it up: service Settings -> Config-as-code -> set path to "railway.helix-signal-outcomes.toml"
# Requires CRON_SECRET on this service (same value as blackout-web).
[build]
builder = "nixpacks"
buildCommand = "echo 'cron trigger service: no app build needed'"
watchPatterns = [
  "scripts/hit-cron.mjs",
  "railway.helix-signal-outcomes.toml",
  "nixpacks.toml",
]

[deploy]
startCommand = "node scripts/hit-cron.mjs /api/cron/helix-signal-outcomes"
# Every 15 minutes during the UTC band that covers RTH in both EDT and EST.
# Route has no off-hours gate — the job is cheap when there are no new firings to grade.
cronSchedule = "*/15 11-21 * * 1-5"
restartPolicyType = "never"
numReplicas = 1
